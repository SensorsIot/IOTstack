deconz:
  image: deconzcommunity/deconz
  container_name: deconz
  restart: unless-stopped
  ports:
    - "8090:80"
    - "7443:443"
    - "5901:5900"
  volumes:
    - ./volumes/deconz:/opt/deCONZ
  devices:
    - "/dev/ttyUSB0:/dev/ttyUSB0"
  environment:
    - DECONZ_VNC_MODE=1
    - DECONZ_VNC_PASSWORD=${DECONZ_VNC_PASSWORD:-IOtSt4ckDec0nZ}
    - DEBUG_INFO=1
    - DEBUG_APS=0
    - DEBUG_ZCL=0
    - DEBUG_ZDP=0
    - DEBUG_OTAU=0

