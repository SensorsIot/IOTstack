chronograf:
  container_name: chronograf
  image: chronograf
  restart: unless-stopped
  user: "0"
  environment:
    TZ: ${TZ:-Etc/UTC}
    # see https://docs.influxdata.com/chronograf/v1.9/administration/config-options/
    INFLUXDB_URL: http://influxdb:8086
    # INFLUX_USERNAME: ${INFLUXDB1_USERNAME:-dba}
    # INFLUX_PASSWORD: ${INFLUXDB1_PASSWORD:?eg echo INFLUXDB1_PASSWORD=supremo >>~/IOTstack/.env}
    # INFLUXDB_ORG:
    KAPACITOR_URL: http://kapacitor:9092
    CHRONOGRAF_AS_ROOT: true
  ports:
    - "8888:8888"
  volumes:
    - ./volumes/chronograf:/var/lib/chronograf
  depends_on:
    - influxdb
    - kapacitor
