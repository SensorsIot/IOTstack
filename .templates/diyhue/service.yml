diyhue:
  container_name: diyhue
  image: diyhue/core:latest
  ports:
    - "8070:80/tcp"
    - "1900:1900/udp"
    - "1982:1982/udp"
    - "2100:2100/udp"
  # - "2443:443/tcp"
  environment:
    IP: ${DIYHUE_IP_ADDRESS:?eg echo DIYHUE_IP_ADDRESS=%LAN_IP_Address% >>~/IOTstack/.env}
    MAC: ${DIYHUE_MAC_ADDRESS:?eg echo DIYHUE_MAC_ADDRESS=%LAN_MAC_Address% >>~/IOTstack/.env}
  volumes:
    - ./volumes/diyhue:/opt/hue-emulator/export
  restart: unless-stopped

